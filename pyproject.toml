[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mgds"
dynamic = ["version"]
authors = [
  { name="Nerogar" },
]
description = "Modular Pytorch DataSet implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13",
    "torchvision>=0.27",
    "numpy>=2.2",
    "pillow>=13.0",
    "tqdm>=4.67",
    "av>=16.0",
    "huggingface-hub>=1.22",
    "transformers>=5.5",
    "diffusers>=0.38",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache License",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.13",
    "torchvision>=0.27",
]
cu132 = [
    "torch>=2.13",
    "torchvision>=0.27",
]

[project.urls]
Homepage = "https://github.com/Nerogar/mgds"
Issues = "https://github.com/Nerogar/mgds/issues"

[tool.setuptools_scm]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu132" },
    ],
]

[tool.uv.pip]
extra-index-url = ["https://download.pytorch.org/whl/cu132"]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers.git", rev = "578c9b2c6636ab2424a0e56186268b83623656b2" }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
